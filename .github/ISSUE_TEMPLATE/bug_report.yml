name: Bug report
description: Something is broken — the bridge won't start, a message is lost, a card doesn't respond.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A good bug report includes the environment and a reproduction. 
        (中文反馈也可以，用中文写就行。)
  - type: input
    id: dsh-version
    attributes:
      label: dsh version
      description: Output of `dsh --version` (or how you installed dsh).
      placeholder: e.g. 0.1.0-rc.8
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v22.22.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (systemd)
        - macOS
        - Windows / WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened? Paste the log tail if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce (e.g. "send this message, click that card button").
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Relevant config (optional)
      description: sessionScope, output mode, denyTools, etc. Redact secrets!
