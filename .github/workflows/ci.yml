name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node plugin-contract-test.mjs
      - run: pnpm typecheck
      - run: node scripts/verify-dsh-contract.mjs
      - run: pnpm test
